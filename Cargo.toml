[workspace]
resolver = "2"
members = ["crates/pe", "crates/recomp", "crates/runtime", "crates/poc", "crates/game", "crates/xmp-sys", "crates/runtime-tests", "crates/x86-cases", "crates/x86-tests", "crates/x86-oracle"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
bugatron-pe = { path = "crates/pe" }
bugatron-recomp = { path = "crates/recomp" }
bugatron-runtime = { path = "crates/runtime" }
bugatron-xmp-sys = { path = "crates/xmp-sys" }
bugatron-x86-cases = { path = "crates/x86-cases" }
iced-x86 = { version = "1.22", default-features = false, features = ["std", "decoder", "intel", "instr_info"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
crc32fast = "1"
cc = "1"
sdl3-sys = { version = "0.7", features = ["use-pkg-config"] }
naga = { version = "30", features = ["wgsl-in", "msl-out", "spv-out"] }
spirv-cross2 = { version = "0.7.2", default-features = false, features = ["hlsl"] }
libc = "0.2"
clap = { version = "4", features = ["derive", "env"] }
num-bigint = "0.4"
num-traits = "0.2"
num-integer = "0.1"
windows-sys = { version = "0.59", features = ["Win32_System_Memory", "Win32_System_Diagnostics_Debug", "Win32_Foundation", "Win32_System_Kernel"] }
iced-x86-asm = { package = "iced-x86", version = "1.22", default-features = false, features = ["std", "decoder", "intel", "instr_info", "code_asm"] }
