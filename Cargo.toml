[workspace]
resolver = "2"
members = ["crates/pe", "crates/recomp", "crates/runtime", "crates/game", "crates/zball", "crates/worlds", "crates/launcher", "crates/build", "crates/unpack", "crates/scenario", "crates/xmp-sys", "crates/runtime-tests", "crates/x86-cases", "crates/x86-tests", "crates/x86-oracle"]

[workspace.package]
edition = "2021"
version = "1.0.0"
license = "GPL-3.0-only"
publish = false

[workspace.dependencies]
bugatron-pe = { path = "crates/pe" }
retro64-recomp = { path = "crates/recomp" }
bugatron-runtime = { path = "crates/runtime" }
bugatron-launcher = { path = "crates/launcher" }
bugatron-build = { path = "crates/build" }
bugatron-unpack = { path = "crates/unpack" }
bugatron-scenario = { path = "crates/scenario" }
bugatron-xmp-sys = { path = "crates/xmp-sys" }
bugatron-x86-cases = { path = "crates/x86-cases" }
iced-x86 = { version = "1.22", default-features = false, features = ["std", "decoder", "intel", "instr_info"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
toml_edit = "0.25"
lewton = "0.10"
sha2 = "0.10"
cc = "1"
sdl3-sys = { version = "0.7", features = ["use-pkg-config"] }
naga = { version = "30", features = ["wgsl-in", "msl-out", "spv-out"] }
spirv-cross2 = { version = "0.7.2", default-features = false, features = ["hlsl"] }
libc = "0.2"
clap = { version = "4", features = ["derive", "env"] }
inno = { version = "0.7.6", default-features = false, features = ["extract"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
num-bigint = "0.4"
num-traits = "0.2"
num-integer = "0.1"
windows-sys = { version = "0.59", features = ["Win32_System_Memory", "Win32_System_Diagnostics_Debug", "Win32_Foundation", "Win32_System_Kernel"] }
iced-x86-asm = { package = "iced-x86", version = "1.22", default-features = false, features = ["std", "decoder", "intel", "instr_info", "code_asm"] }
