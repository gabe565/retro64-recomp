name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # SHA-256 of each game's zip (README.md).
  BUGATRON_SHA256: f3ee37e54c998eb8167c997f95b9dd4c81c482633c454bb2d4d5ba2f52e894f9
  ZBALL_SHA256: 2b733a874bcf16d2a301c27e64438739402e36c7216cb6a7aa8d0638381ebcad
  # The Bugatron Worlds free trial's installer.
  BUGATRON_WORLDS_SHA256: fb5ee4a6a877f382dab311f6569e119562a50d28a652c3f29148a7a8aba97e7b

jobs:
  test:
    name: test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Debian 13 packages SDL3; Vulkan comes from Mesa's lavapipe under Xvfb.
          - name: linux
            os: ubuntu-latest
            container: debian:trixie
            run: xvfb-run -a
            require_gpu: "1"
          # Hosted macOS runners may not expose Metal; GPU tests report "ignored" then.
          - name: macos
            os: macos-latest
            require_gpu: ""
          # SDL3 is built from source (no pkg-config with MSVC); D3D12 runs on WARP.
          - name: windows
            os: windows-latest
            features: --features bugatron-runtime/sdl3-from-source
            require_gpu: "1"
    env:
      # The games are provided only to this repository's own runs: secrets are not
      # passed to pull requests from forks, which then run the game-free tests.
      # Each game is tested when its URL is set.
      BUGATRON_URL: ${{ secrets.BUGATRON_GAME_URL }}
      ZBALL_URL: ${{ secrets.ZBALL_GAME_URL }}
      BUGATRON_WORLDS_URL: ${{ secrets.BUGATRON_WORLDS_GAME_URL }}
      BUGATRON_REQUIRE_GPU: ${{ matrix.require_gpu }}
      SDL_AUDIO_DRIVER: dummy
    defaults:
      run:
        shell: bash
    steps:
      - name: Install packages (Debian)
        if: matrix.name == 'linux'
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential pkg-config curl ca-certificates git \
            openssl libsdl3-dev mesa-vulkan-drivers xvfb xauth

      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Install SDL3 (macOS)
        if: matrix.name == 'macos'
        run: brew install sdl3

      - name: Put DXC on PATH (Windows)
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          $dxc = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\dxc.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $dxc) { throw "dxc.exe not found in the Windows SDK" }
          $dxc.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Append

      - uses: Swatinem/rust-cache@v2

      - name: Fetch Bugatron
        if: env.BUGATRON_URL != ''
        uses: ./.github/actions/fetch-game
        with:
          url: ${{ secrets.BUGATRON_GAME_URL }}
          token: ${{ secrets.BUGATRON_GAME_TOKEN }}
          sha256: ${{ env.BUGATRON_SHA256 }}
          file: Bugatron_Win_EN_Gold_120.zip

      - name: Fetch Z-Ball
        if: env.ZBALL_URL != ''
        uses: ./.github/actions/fetch-game
        with:
          url: ${{ secrets.ZBALL_GAME_URL }}
          token: ${{ secrets.ZBALL_GAME_TOKEN }}
          sha256: ${{ env.ZBALL_SHA256 }}
          file: Z-Ball_Win_EN_Full-Rip.zip

      - name: Fetch Bugatron Worlds
        if: env.BUGATRON_WORLDS_URL != ''
        uses: ./.github/actions/fetch-game
        with:
          url: ${{ secrets.BUGATRON_WORLDS_GAME_URL }}
          token: ${{ secrets.BUGATRON_WORLDS_GAME_TOKEN }}
          sha256: ${{ env.BUGATRON_WORLDS_SHA256 }}
          file: bugatron_worlds.exe

      # Everything, less the crates of games without a copy (they need it to build).
      - name: Test
        run: |
          skip=()
          if [ -z "$BUGATRON_URL" ]; then skip+=(--exclude bugatron --exclude bugatron-poc); fi
          if [ -z "$ZBALL_URL" ]; then skip+=(--exclude zball); fi
          if [ -z "$BUGATRON_WORLDS_URL" ]; then skip+=(--exclude bugatron-worlds); fi
          ${{ matrix.run }} cargo test --release --workspace "${skip[@]}" ${{ matrix.features }}

      # Short scripted sessions. Each fails on any unimplemented import or method,
      # guest fault, or panic.
      # Bugatron: start a game (F1), steer, fire.
      - name: Play Bugatron
        if: env.BUGATRON_URL != ''
        run: >
          ${{ matrix.run }} cargo run --release -p bugatron ${{ matrix.features }} --
          --unpaced --video-mode 640x480x32 --save target/ci-save --frames 1500
          --input "600:F1,800:click@70x120,1000:CTRL+,1000:LEFT+,1100:LEFT-,1150:RIGHT+,1250:RIGHT-"

      # Z-Ball: start (F1), pick the first level set (F1), move the paddle with the
      # mouse, launch the ball (click), and with the Up key.
      - name: Play Z-Ball
        if: env.ZBALL_URL != ''
        run: >
          ${{ matrix.run }} cargo run --release -p zball ${{ matrix.features }} --
          --unpaced --video-mode 640x480x32 --save target/ci-save-zball --frames 2500
          --input "700:F1,1300:F1,1900:move@600x100,2000:click@600x100,2100:move@600x300,2200:UP+,2300:UP-"

      # Bugatron Worlds (free trial): past the trial screen (Maybe later), Start
      # Game, Level 1, through How to Play, then steer and fire.
      - name: Play Bugatron Worlds
        if: env.BUGATRON_WORLDS_URL != ''
        run: >
          ${{ matrix.run }} cargo run --release -p bugatron-worlds ${{ matrix.features }} --
          --unpaced --save target/ci-save-worlds --frames 4500
          --input "350:click@620x540,1100:click@400x443,1500:click@140x180,2100:click@735x578,2500:click@735x578,2900:click@735x578,3600:CTRL+,3600:LEFT+,3800:LEFT-,3900:RIGHT+,4200:RIGHT-,4400:CTRL-"
