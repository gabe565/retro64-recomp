[package]
name = "bugatron-runtime"
description = "Portable runtime for statically recompiled Bugatron code"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
bugatron-pe.workspace = true
num-bigint.workspace = true
num-traits.workspace = true
num-integer.workspace = true
sdl3-sys.workspace = true
serde.workspace = true
toml.workspace = true
bugatron-xmp-sys.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[build-dependencies]
naga.workspace = true
spirv-cross2.workspace = true

[features]
# Build SDL3 from source and link it statically, instead of finding it with
# pkg-config (used for Windows CI; MSVC has no pkg-config).
sdl3-from-source = ["sdl3-sys/build-from-source-static"]
