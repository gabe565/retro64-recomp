[package]
name = "bugatron"
description = "Bugatron Gold v1.20a, statically recompiled: the full game on the portable runtime"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
bugatron-runtime.workspace = true
clap.workspace = true
inno.workspace = true
zip.workspace = true
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true

[build-dependencies]
bugatron-recomp.workspace = true
