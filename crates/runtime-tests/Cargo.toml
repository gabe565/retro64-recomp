[package]
name = "bugatron-runtime-tests"
description = "Runtime regression tests: imports, COM methods, surfaces and messages driven through the real dispatch path"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
bugatron-runtime.workspace = true
bugatron-xmp-sys.workspace = true

[build-dependencies]
retro64-recomp.workspace = true
bugatron-x86-cases.workspace = true
cc.workspace = true

# SDL's video subsystem (needed by GPU devices) must run on the main thread on
# macOS, so the GPU tests use their own runner instead of libtest's threads.
[[test]]
name = "gpu"
harness = false
